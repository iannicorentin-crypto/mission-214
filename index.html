<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION 214</title>
<style>
    body {
        background: #000;
        color: #00ff41;
        font-family: monospace;
        padding: 30px;
        font-size: 16px;
    }
    .terminal {
        max-width: 650px;
        margin: 60px auto;
        border: 1px solid #00ff41;
        padding: 25px;
        box-shadow: 0 0 15px #003b0f;
    }
    h1 {
        font-size: 24px;
        text-align: center;
    }
    input, button {
        background: #000;
        color: #00ff41;
        border: 1px solid #00ff41;
        padding: 10px;
        font-family: monospace;
        font-size: 16px;
        margin-top: 10px;
    }
    button {
        cursor: pointer;
    }
    #message {
        display: none;
        margin-top: 25px;
        white-space: pre-line;
    }
</style>
</head>
<body>
<div class="terminal">
    <h1>TERMINAL SÉCURISÉ</h1>
    <p>> MISSION 214</p>
    <p>> Accès réservé au personnel autorisé.</p>
    <p>> Veuillez saisir le code d'accès :</p>

    <input type="password" id="code" placeholder="Code secret">
    <button onclick="verifierCode()">VALIDER</button>

    <div id="message"></div>
</div>

<script>
function verifierCode() {
    const code = document.getElementById("code").value;
    const message = document.getElementById("message");

    if (code === "214") {
        message.style.display = "block";
        message.textContent =
        "ACCÈS AUTORISÉ.\n\nFélicitations, agente.\n\nVous avez terminé la mission.\n\nPour la suite des opérations, contactez l'agent 214 après votre soirée.";
    } else {
        message.style.display = "block";
        message.textContent = "ACCÈS REFUSÉ. Veuillez réessayer.";
    }
}
</script>
</body>
</html>
